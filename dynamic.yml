http:
  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

    default-sec-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: no-referrer

    gzip-compress:
      compress: {}

    cors-headers:
      headers:
        accessControlAllowOriginList:
          - "https://cashmsystem.com.ar"
          - "https://www.cashmsystem.com.ar"
          - "https://cleversell.com.ar"
          - "https://www.cleversell.com.ar"
          - "https://kliva.com.ar"
          - "https://www.kliva.com.ar"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Requested-With"
          - "Accept"
          - "Origin"
          - "Idempotency-Key"
          - "X-API-TOKEN"
          - "x-locale"
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400

  routers:
    http-catchall:
      rule: 'HostRegexp("{any:.+}")'
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: noop

    traefik-dashboard:
      entryPoints:
        - websecure
      rule: 'Host("proxy.tu-dominio.com")'  # cambia por tu dominio real del dashboard
      service: api@internal
      middlewares:
        - default-sec-headers
      tls: {}

    kliva:
      entryPoints:
        - websecure
      rule: 'Host("kliva.com.ar") || Host("www.kliva.com.ar")'
      service: kliva
      middlewares:
        - default-sec-headers
        - gzip-compress
      tls: {}

  services:
    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1"

    kliva:
      loadBalancer:
        servers:
          - url: "http://klivaweb:8010"

tls:
  options:
    default:
      minVersion: VersionTLS12
  certificates:
    - certFile: /etc/ssl/cleversell/cleversell.com.ar.crt
      keyFile: /etc/ssl/cleversell/cleversell.com.ar.key
    - certFile: /etc/ssl/cashmsystem/cashmsystem.com.ar.crt
      keyFile: /etc/ssl/cashmsystem/cashmsystem.com.ar.key
    - certFile: /etc/ssl/kliva/kliva.com.ar.crt
      keyFile: /etc/ssl/kliva/kliva.com.ar.key
